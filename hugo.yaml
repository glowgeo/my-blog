# ============================================================
#  站点基础配置
#  改完保存即可，Netlify 会自动重新构建
# ============================================================

baseURL: "https://example.com/"
title: "小林的博客"
theme: "PaperMod"

locale: "zh-CN" # Hugo 0.158+ 用 locale 取代了 languageCode
defaultContentLanguage: "zh"
hasCJKLanguage: true # 中文按字计数，阅读时长才准

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

# 首页要展示哪些目录下的文章
mainSections: ["posts"]

pagination:
  pagerSize: 8 # 首页每页文章数

minify:
  disableXML: true
  minifyOutput: true

# ------------------------------------------------------------
#  输出格式：首页额外输出 JSON，供站内搜索使用
# ------------------------------------------------------------
outputs:
  home:
    - HTML
    - RSS
    - JSON

# ------------------------------------------------------------
#  主题参数
# ------------------------------------------------------------
params:
  env: production
  title: "小林的博客"
  description: "小林的个人博客，记录想法、笔记和踩过的坑"
  keywords: ["小林", "博客", "随笔", "笔记"]
  author: "小林"

  mainSections: ["posts"] # 部分版本读这里，两处都写更保险

  # 左上角的站点标识
  label:
    text: "小林的博客"
    icon: "favicon-32x32.png"

  DateFormat: "2006-01-02"
  defaultTheme: auto # auto / light / dark
  disableThemeToggle: false
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  UseHugoToc: true
  disableScrollToTop: false
  disableSpecial1stPost: false
  hidemeta: false
  hideSummary: false
  showtoc: true # 文章目录
  tocopen: false # 目录默认折叠
  comments: false # ← 想开评论改成 true，并填好下面 giscus

  homeInfoParams:
    Title: "你好，我是小林 👋"
    Content: >
      这是我的个人博客。
      我会在这里记录一些想法、笔记和踩过的坑。
      偶尔也会写点小游戏放在这里玩。

  profileMode:
    enabled: false

  assets:
    disableHLJS: true # 用 Hugo 自带代码高亮，不额外加载 highlight.js

  # 社交图标：不需要的整段删掉
  socialIcons:
    - name: github
      url: "https://github.com/glowgeo"
    - name: rss
      url: "index.xml"

  # ----------------------------------------------------------
  #  Giscus 评论（基于 GitHub Discussions，完全免费）
  #  repoId / categoryId 的获取方式见「上线操作指南.md」
  # ----------------------------------------------------------
  giscus:
    repo: "你的用户名/你的仓库名"
    repoId: ""
    category: "Announcements"
    categoryId: ""
    mapping: "pathname"
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    theme: "preferred_color_scheme"
    lang: "zh-CN"
    loading: "lazy"

# ------------------------------------------------------------
#  导航菜单
# ------------------------------------------------------------
menu:
  main:
    - identifier: news
      name: 要闻
      pre: "📰"
      url: /news/
      weight: 5
    - identifier: posts
      name: 文章
      pre: "✍️"
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      pre: "🗂️"
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      pre: "🏷️"
      url: /tags/
      weight: 30
    - identifier: games
      name: 小游戏
      pre: "🎮"
      url: /games/
      weight: 40
    - identifier: deals
      name: 薅羊毛
      pre: "🛒"
      url: /deals/
      weight: 45
    - identifier: search
      name: 搜索
      pre: "🔍"
      url: /search/
      weight: 50

# ------------------------------------------------------------
#  正文渲染
# ------------------------------------------------------------
markup:
  goldmark:
    renderer:
      unsafe: true # 允许正文里直接写 HTML
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["$$", "$$"], ["\\[", "\\]"]]
          inline: [["$", "$"], ["\\(", "\\)"]]
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    lineNumbersInTable: true
    tabWidth: 4
    style: monokai

tableOfContents:
  startLevel: 2
  endLevel: 3
  ordered: false
